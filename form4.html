<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>4. Radio Button</title>
    <style>body {font-family: Arial; margin: 50px;}</style>
</head>
<body>
    <h2>4. Radio Button Formasi</h2>
    <form method="POST">
        <p>Eng yaxshi dasturlash tili qaysi?</p>
        <input type="radio" name="tanlov" value="Python" id="py">
        <label for="py">Python</label><br>
        
        <input type="radio" name="tanlov" value="JavaScript" id="js">
        <label for="js">JavaScript</label><br>
        
        <input type="radio" name="tanlov" value="Java" id="java">
        <label for="java">Java</label><br><br>
        
        <button type="submit">Yuborish</button>
    </form>
    <br><a href="/">Bosh sahifaga</a>
</body>
</html>
